<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Course Management System</h1>
        <button id="logoutBtn" class="btn logout-btn" style="display: none;">Logout</button>
    </header>

    <main>
        <!-- Auth Section -->
        <div class="container" id="authSection">
            <div class="card">

                <div class="toggle-buttons">
                    <button type="button" class="btn" onclick="showRegister()">Register</button>
                    <button type="button" class="btn" onclick="showLogin()">Login</button>
                </div>

                <!-- Student Registration Form -->
                <form id="registerForm" class="form-section" style="display: none;">
                    <h2>Student Registration</h2>
                    <input type="text" id="regName" placeholder="Student Name">
                    <input type="email" id="regEmail" placeholder="Email">
                    <input type="password" id="regPassword" placeholder="Password">
                    <button type="button" id="register" class="btn">Register</button>
                </form>

                <!-- Student Login Form -->
                <form id="loginForm" class="form-section" style="display: none;">
                    <h2>Student Login</h2>
                    <input type="email" id="loginEmail" placeholder="Email">
                    <input type="password" id="loginPassword" placeholder="Password">
                    <button type="button" id="login" class="btn">Login</button>
                </form>

            </div>
        </div>

        <!-- Course Section -->
        <div class="container" id="courseSection" style="display: none;">

            <!-- Search -->
            <div class="card">
                <h2>Search</h2>
                <div class="search-row">
                    <input type="text" id="searchInput" placeholder="Search course">
                    <button type="button" id="searchBtn" class="btn">Search</button>
                </div>
            </div>

            <!-- Available Courses -->
            <div class="card">
                <h2>Available Courses</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Course</th>
                            <th>Instructor</th>
                            <th>Duration</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="courseList"></tbody>
                </table>
            </div>

            <!-- My Enrollments -->
            <div class="card">
                <h2>My Enrollments</h2>
                <div id="enrollmentList"></div>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
